[G29 Racing Wheel]
# Logitech G923 in PC mode (product ID c266) via new-lg4ff driver
# Kernel axes: ABS_X=0 (wheel), ABS_Y=1 (gas), ABS_Z=2 (brake), ABS_RZ=3 (clutch)
# Pedals: rest=+1, fully pressed=-1 (same as G29)

# Axis indices
steering_wheel = 0
throttle = 2
brake = 3

# Button indices
reverse = 6
handbrake = 7
# Paddle shifters: right = up, left = down (a press in automatic switches to
# manual). Swap the numbers if your paddles shift the wrong way.
# パドルシフト：右 = シフトアップ、左 = ダウン（AT 中に押すと MT に切替）
gear_up = 4
gear_down = 5
# back to automatic / AT に戻す
transmission = 9

[Sensitivity]
# Steering: output = tan(steer_curve * input) * steer_gain, clamped to +/- steer_clamp.
# Lower steer_curve = less twitchy near centre. Lower steer_gain = less overall response.
# Full lock (1.0) should land at the wheel's own lock (900 deg = input +-1):
# keep steer_gain = 1 / tan(steer_curve). With 1.0 / 1.1 the steering maxed
# out at +-321 deg and the last 130 deg each side did nothing.
# ハンドル全域（900°）を使うには steer_gain = 1 / tan(steer_curve) とする。
steer_gain = 1.83
steer_curve = 0.5
steer_clamp = 1.0

# Pedal sensitivity moved to pedal_tuning.json (created on first run).
# Adjust it live from the dashboard's Settings tab (Driving > Pedal Tuning), or in the sim
# with [ / ] (throttle strength) and Shift+[ / Shift+] (brake strength).
#   *_max   = output at full pedal press (0.1 .. 1.0)
#   *_curve = response exponent; higher = gentler at light press

